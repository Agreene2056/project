	<!-- Use the main area to add the main content of the webpage -->
<main>
	     <h2 class="contact-h2">Need help? Fill out the form below</h2> 
            
                <form action="https://formspree.io/f/maqvqbyo" method="POST">
                    
                    <fieldset>
                        <legend>Contact Information</legend>
                        <label for="fName">First Name:</label>
                        <input type="text" name="fName" id="fName" required>
                        <label for="lName">Last Name:</label>
                        <input type="text" name="lName" id="lName" required>                       
                        <label for="email">Email:</label>
                        <input type="email" name="email" id="email" required>                  
                        <label for="phone">Phone:</label>
                        <input type="tel" id="phone" name="phone" required>
						
						
                    </fieldset>
                    
                    <fieldset>
                        <legend>Additional Information</legend>
                        <p>Select a checkbox below</p>                   
                        <label for="Feedback"><input type="checkbox" name="interest" id="Feedback" value="Feedback">Feedback</label>
                        <label for="Suggest"><input type="checkbox" name="interest" id="Suggest" value="Suggestions">Suggestions</label>
                        <label for="Killers"><input type="checkbox" name="interest" id="Killers" value="Killers">Killers</label>
						<label for="Other"><input type="checkbox" name="interest" id="Other" value="Others">Others</label>
                    </fieldset>
                    
                    <fieldset>
                            <legend>Referral Source</legend>
                            <label for="reference">How did you find us?</label>
                            <select name="reference" id="reference">
								<option value="blank">-</option>
                                <option value="ad">Advertisement</option>
                                <option value="friend">Friend</option>
                                <option value="google">Google</option>
                                <option value="social">Social Media</option>
                                <option value="other">Other</option>
                            </select>

                            <label for="questions">Questions?</label>
                            <textarea id="questions" name="questions" rows="5" cols="35"></textarea>
                    </fieldset>
                    
                    <input type="submit" id="submit" value="Submit" class="btn">
                    
                </form>
	
</main>
